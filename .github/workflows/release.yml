name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="clifleet_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags "-s -w -X github.com/indiekitai/clifleet/internal/cli.Version=${GITHUB_REF_NAME}" -o "$name" ./cmd/clifleet
          tar -czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: clifleet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clifleet_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    name: publish
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
