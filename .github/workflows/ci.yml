name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o clifleet ./cmd/clifleet
      - name: Smoke
        run: |
          ./clifleet version
          ./clifleet --help
          ./clifleet status --help
          ./clifleet upgrade --help
